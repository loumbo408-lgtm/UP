services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Keep node_modules inside the container (not overwritten by host)
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_SUPABASE_URL=https://gtxyoyxdesvjufsilkrt.supabase.co
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_4IzXoV3kL9UEERv0BzFHdA_vQN-oNYb
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_4IzXoV3kL9UEERv0BzFHdA_vQN-oNYb
      - SUPABASE_URL=https://gtxyoyxdesvjufsilkrt.supabase.co
      - SUPABASE_PUBLISHABLE_KEY=sb_publishable_4IzXoV3kL9UEERv0BzFHdA_vQN-oNYb
      - SUPABASE_JWKS_URL=https://gtxyoyxdesvjufsilkrt.supabase.co/auth/v1/.well-known/jwks.json
      - NEXT_PUBLIC_HOTLINE_PHONE=+241077000000
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- -H 0.0.0.0 -p 3000"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  web_node_modules:
  web_next:
